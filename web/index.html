<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Asad (@AsadDUET) — Flutter & Mobile Application Developer Portfolio. Explore published Android & iOS apps, architecture, and store privacy policies.">
  <meta name="keywords" content="Asad, AsadDUET, Flutter Developer, Mobile App Developer, Android, iOS, DUET, Portfolio">
  <meta name="author" content="Asad (@AsadDUET)">

  <!-- Open Graph / Social Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Asad | Flutter & Mobile App Developer">
  <meta property="og:description" content="Explore mobile applications, interactive screen previews, and engineering portfolio by Asad (@AsadDUET).">
  <meta property="og:url" content="https://asadduet.github.io/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Asad Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Asad | Flutter & Mobile App Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #090D16;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111827 0%, #090D16 100%);
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(99, 102, 241, 0.25);
      border-top-color: #06B6D4;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 16px;
    }
    .loading-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #F8FAFC;
    }
    .loading-sub {
      font-size: 13px;
      color: #94A3B8;
      margin-top: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="loading-title">Asad • Mobile App Portfolio</div>
    <div class="loading-sub">Loading Flutter Web Experience...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 350);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
